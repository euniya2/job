<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할일 관리 웹앱 (Todo App)</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="w-full bg-white/80 backdrop-blur-md shadow-sm py-4 px-6 sticky top-0 z-10">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-pink-600 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-list-check text-indigo-600"></i> My Todo App
            </h1>
            <span id="current-date" class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full"></span>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto px-4 py-8 flex-grow">
        <!-- Input Form Card -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-slate-100">
            <form id="todo-form" class="flex gap-3">
                <div class="relative flex-grow">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <i class="fa-solid fa-pen"></i>
                    </span>
                    <input 
                        type="text" 
                        id="todo-input" 
                        placeholder="새로운 할일을 입력하세요..." 
                        class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm font-medium"
                        autocomplete="off"
                    >
                </div>
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-6 py-3.5 rounded-xl font-semibold shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">추가</span>
                </button>
            </form>
        </div>

        <!-- Progress and Filter Bar -->
        <div class="bg-white/60 backdrop-blur-sm rounded-xl p-4 mb-6 shadow-sm border border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="w-full sm:w-auto flex-1">
                <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1.5">
                    <span id="progress-text">완료율: 0%</span>
                    <span id="task-count">0개 남음</span>
                </div>
                <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-pink-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
            
            <!-- Filters -->
            <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold w-full sm:w-auto justify-center">
                <button onclick="setFilter('all')" id="filter-all" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg bg-white shadow-sm text-indigo-600 transition-all">전체</button>
                <button onclick="setFilter('active')" id="filter-active" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-slate-600 transition-all">진행중</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-slate-600 transition-all">완료됨</button>
            </div>
        </div>

        <!-- Todo List Container -->
        <div class="space-y-3" id="todo-list">
            <!-- Dynamic Todo Items will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-clipboard-check"></i>
            </div>
            <h3 class="text-slate-600 font-semibold text-base">할일이 없습니다!</h3>
            <p class="text-slate-400 text-xs mt-1">새로운 할일을 추가해 하루를 계획해보세요.</p>
        </div>
    </main>

    <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white/40">
        <p>&copy; 2026 Todo App. All rights reserved.</p>
    </footer>

    <script>
        // State variables
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        let currentFilter = 'all';

        // Elements
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const emptyState = document.getElementById('empty-state');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const taskCount = document.getElementById('task-count');
        const currentDateEl = document.getElementById('current-date');

        // Display current date nicely in Korean
        function updateDate() {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            const today = new Date();
            currentDateEl.textContent = today.toLocaleDateString('ko-KR', options);
        }

        // Save todos to LocalStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Add a new todo
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (!text) return;

            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
            };

            todos.unshift(newTodo);
            todoInput.value = '';
            saveAndRender();
        });

        // Toggle todo completion
        function toggleTodo(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            saveAndRender();
        }

        // Delete todo
        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveAndRender();
        }

        // Set Filter
        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'active', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "flex-1 sm:flex-none px-3 py-1.5 rounded-lg bg-white shadow-sm text-indigo-600 transition-all font-semibold";
                } else {
                    btn.className = "flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-slate-600 transition-all";
                }
            });
            renderTodos();
        }

        // Render Todo items and progress
        function renderTodos() {
            // Filter todos
            let filteredTodos = todos;
            if (currentFilter === 'active') {
                filteredTodos = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.completed);
            }

            // Render list
            if (filteredTodos.length === 0) {
                todoList.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                todoList.innerHTML = filteredTodos.map(todo => `
                    <div class="group bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex items-center justify-between gap-3 hover:shadow-md transition-all">
                        <label class="flex items-center gap-3.5 flex-grow cursor-pointer select-none">
                            <input 
                                type="checkbox" 
                                ${todo.completed ? 'checked' : ''} 
                                onchange="toggleTodo(${todo.id})"
                                class="w-5 h-5 accent-indigo-600 rounded cursor-pointer"
                            >
                            <span class="text-sm font-medium transition-all ${todo.completed ? 'line-through text-slate-400' : 'text-slate-700'}">
                                ${escapeHtml(todo.text)}
                            </span>
                        </label>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-slate-400 font-medium hidden sm:inline">${todo.createdAt}</span>
                            <button 
                                onclick="deleteTodo(${todo.id})" 
                                class="text-slate-400 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 transition-all opacity-80 sm:opacity-0 group-hover:opacity-100"
                                title="삭제"
                            >
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // Update stats
            const totalCount = todos.length;
            const completedCount = todos.filter(t => t.completed).length;
            const activeCount = totalCount - completedCount;
            const percent = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

            progressBar.style.width = `${percent}%`;
            progressText.textContent = `완료율: ${percent}%`;
            taskCount.textContent = `${activeCount}개 남음`;
        }

        // Helper function to prevent XSS
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Save and Render helper
        function saveAndRender() {
            saveTodos();
            renderTodos();
        }

        // Initialize on load
        window.onload = () => {
            updateDate();
            renderTodos();
        };
    </script>
</body>
</html>
